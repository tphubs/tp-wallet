name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tp-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK to the "latest" release (download without login)
        if: github.event_name != 'pull_request'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk tp-wallet.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tp-wallet.apk --title "TP Wallet Android (mới nhất)" --notes "File cài đặt Android mới nhất, tự cập nhật mỗi lần sửa code."
        env:
          GH_TOKEN: ${{ github.token }}
